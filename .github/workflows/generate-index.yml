name: Generate Protocol Index

on:
  push:
    branches: [main]
    # The index is a function of the protocols *and* of the generator version pinned below, so a
    # change to this workflow must regenerate it too.
    paths:
      - 'protocols/**'
      - '.github/workflows/generate-index.yml'

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    # The deploy key lives in this environment, whose deployment branch policy allows only `main`.
    # A pull request from a branch in this repository would otherwise be able to read it — same-repo
    # PRs do receive secrets — and the key bypasses branch protection.
    environment: index-generation
    steps:
      # Authenticates with a write-scoped deploy key rather than GITHUB_TOKEN: the require-pr-review
      # ruleset blocks github-actions[bot], and Actions cannot be granted a bypass, because bypass
      # actors of type Integration must be GitHub Apps installed on the organisation.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.INDEX_DEPLOY_KEY }}
      # @v0 is a moving tag, so this repository tracks the standard without a PR per release —
      # which is the point: an index generated by a stale generator is an index that disagrees with
      # the standard it claims to follow. Pin @v0.3.0 or a commit SHA instead if you need the action
      # to be immutable, and accept updating it by hand.
      - uses: waldronlab/agent-protocol-standard/actions/generate-index@v0
